{% load humanize %}
<div class="grid grid-2">
  {% for s in sections %}
  <div class="sec-card" style="--c: {{ s.color }}">
    <div class="row" style="gap:18px">
      <span class="tile {% if s.key == 'speaking' %}g-green{% elif s.key == 'writing' %}g-purple{% elif s.key == 'listening' %}g-blue{% else %}g-amber{% endif %}">{% include "partials/icon.html" with name=s.icon %}</span>
      <div><h3>{{ s.label }}</h3><span class="muted">{{ s.mocks }} mock{{ s.mocks|pluralize }} · CEFR</span></div>
    </div>
    <p class="mt-2 sec-stats"><span style="color:#f59e0b">⚡</span> <strong>{{ s.today|intcomma }}</strong> taken today <span class="muted">&nbsp;·&nbsp;</span> <strong>{{ s.total|intcomma }}</strong> all-time</p>
    <a class="btn btn-lg btn-block sec-go" href="{% url 'exams:section' s.key %}">CEFR →</a>
  </div>
  {% endfor %}
</div>
