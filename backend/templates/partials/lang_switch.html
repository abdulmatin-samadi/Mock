{% load i18n %}{% get_current_language as LANG %}<form class="lang-switch{% if cls %} {{ cls }}{% endif %}" method="post" action="{% url 'set_language' %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><button type="submit" name="language" value="uz" class="{% if LANG == 'uz' %}active{% endif %}" aria-label="O'zbekcha" {% if LANG == 'uz' %}aria-pressed="true"{% endif %}>UZ</button><button type="submit" name="language" value="en" class="{% if LANG == 'en' %}active{% endif %}" aria-label="English" {% if LANG == 'en' %}aria-pressed="true"{% endif %}>EN</button></form>
