<div class="form-field">
  {% if field.widget_type == 'checkbox' %}
    <div class="form-check">{{ field }}<label for="{{ field.id_for_label }}">{{ field.label }}</label></div>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span aria-hidden="true" class="muted">*</span>{% endif %}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<div class="help">{{ field.help_text|safe }}</div>{% endif %}
  {{ field.errors }}
</div>
