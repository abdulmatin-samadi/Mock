{% extends "accounts/_auth_layout.html" %}{% block title %}Reset password{% endblock %}
{% block auth %}
<div class="auth-head"><div class="auth-icon">🔑</div><h1>Forgot your password?</h1><p>Enter your email and we'll send you a reset link.</p></div>
<form method="post" novalidate class="auth-form">{% csrf_token %}{% include "partials/form_fields.html" %}<button class="btn btn-block btn-lg auth-submit" type="submit">Send reset link</button></form>
<p class="auth-switch"><a href="{% url 'accounts:login' %}">← Back to log in</a></p>
{% endblock %}
