{% load core_tags %}{% if page.has_other_pages %}
<nav class="pagination" aria-label="Pagination">
  {% if page.has_previous %}<a href="{% query_replace page=page.previous_page_number %}">← Prev</a>{% endif %}
  <span class="current">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a href="{% query_replace page=page.next_page_number %}">Next →</a>{% endif %}
</nav>{% endif %}
